<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Outfits">
<meta name="theme-color" content="#fafaf9">
<title>Outfits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf9; --surface:#ffffff; --paper:#f1f0ed; --line:#e8e7e3; --line2:#d4d3ce;
    --ink:#111111; --ink2:#3d3d3b; --muted:#8a8a86; --danger:#d0342c;
    --tabh:60px; --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html{overscroll-behavior-y:none}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  body{padding-bottom:calc(var(--tabh) + var(--sb))}
  .locked body{position:fixed;left:0;right:0;overflow:hidden}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  input{font:inherit;font-size:16px}
  img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  a{color:var(--ink)}

  /* icons */
  .i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .i.s{width:18px;height:18px}

  /* layout */
  main{padding:0 16px;max-width:560px;margin:0 auto}
  .view{display:none}
  .view.on{display:block;animation:fade .22s var(--ease)}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .vh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(var(--st) + 14px) 0 12px;min-height:64px}
  .vh h1{font-size:26px;font-weight:700;letter-spacing:-.035em;margin:0;line-height:1.1}
  .vh .sub{margin:2px 0 0;color:var(--muted);font-size:13px;font-weight:500}

  /* buttons */
  .btn{height:48px;padding:0 20px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s var(--ease),background .15s,opacity .15s;white-space:nowrap}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.danger{color:var(--danger)}
  .btn.danger-fill{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.ghost{background:transparent;border-color:transparent}
  .btn.block{width:100%}
  .btn.sm{height:40px;padding:0 16px;font-size:14px}
  .btn:disabled{opacity:.4;pointer-events:none}
  .round{width:48px;height:48px;flex:none;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;transition:transform .12s var(--ease)}
  .round:active{transform:scale(.94)}
  .round.on{color:var(--danger)}
  .round.on .i{fill:currentColor}
  .icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
  .icon-btn:active{background:var(--paper)}

  /* segmented */
  .seg{display:inline-flex;background:var(--paper);border-radius:99px;padding:3px;gap:2px}
  .seg button{white-space:nowrap;height:36px;padding:0 16px;border-radius:99px;font-size:14px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .seg.full{display:flex}.seg.full button{flex:1}

  /* chips */
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 16px 10px;margin:0 -16px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;height:40px;padding:0 15px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
  .chip .n{color:var(--muted);font-size:12px;font-weight:500}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip.on .n{color:rgba(255,255,255,.6)}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

  /* ---------- outfit view ---------- */
  #view-outfit.on{display:flex;flex-direction:column;height:calc(100vh - var(--tabh) - var(--sb));height:calc(100dvh - var(--tabh) - var(--sb));min-height:440px}
  .stage{position:relative;flex:1;min-height:230px;background:var(--paper);border-radius:28px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:box-shadow .15s}
  .board{position:absolute;left:50%;top:50%;height:92%;aspect-ratio:3/4;max-width:94%;transform:translate(-50%,-50%);background:var(--paper)}
  .piece{position:absolute;object-fit:contain;mix-blend-mode:multiply;transition:opacity .15s,transform .2s var(--ease)}
  .stage .piece{cursor:grab;touch-action:none}
  .piece.dragging{opacity:.2}
  .piece.flash{animation:pop .35s var(--ease)}
  @keyframes pop{50%{transform:scale(1.06)}}
  #stageImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .stage-seg{flex:none}
  .stage-seg button{height:36px;padding:0 14px;font-size:13px}
  .expand{position:absolute;right:12px;bottom:12px;z-index:8;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  #stageImg{cursor:zoom-in}
  .viewer{position:fixed;inset:0;z-index:60;background:rgba(10,10,10,1);display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;opacity:0;transition:opacity .2s}
  .viewer.on{opacity:1}
  .viewer > img{max-width:100%;max-height:100%;object-fit:contain;will-change:transform}
  .viewer.anim > img{transition:transform .22s var(--ease)}
  .vbar{position:absolute;top:calc(var(--st) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
  .vbtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .vhint{position:absolute;bottom:calc(var(--sb) + 18px);left:0;right:0;text-align:center;color:rgba(255,255,255,.55);font-size:13px;pointer-events:none}
  .media-seg{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 14px}
  .pager{display:inline-flex;align-items:center;gap:2px;background:var(--paper);border-radius:99px;padding:3px}
  .pager button{width:40px;height:36px;border-radius:99px;display:grid;place-items:center;color:var(--ink)}
  .pager button:disabled{opacity:.3}
  .pager span{min-width:40px;text-align:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .stage .pager{position:absolute;left:12px;bottom:12px;z-index:8;background:rgba(255,255,255,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .stage .pager button{width:40px;height:38px}
  .vcount{align-self:center;color:#fff;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .tip{background:var(--paper);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.45;color:var(--ink);margin:0 0 12px}
  .media.photo > img{cursor:zoom-in}
  .stage-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;color:var(--muted);font-size:14px;line-height:1.5}
  .stage-ph b{color:var(--ink);font-size:19px;letter-spacing:-.02em}
  .stage-ph .btn{margin-top:12px}
  .stage.dnd-add{box-shadow:inset 0 0 0 2px var(--line2)}
  .stage.dnd-add.over{box-shadow:inset 0 0 0 3px var(--ink)}
  .stage.dnd-remove:not(.over){box-shadow:inset 0 0 0 3px var(--danger)}
  .drop-hint{position:absolute;bottom:14px;left:50%;transform:translate(-50%,8px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:.2s var(--ease);pointer-events:none;z-index:9;white-space:nowrap}
  .stage.dnd-add .drop-hint,.stage.dnd-remove .drop-hint{opacity:1;transform:translate(-50%,0)}
  .busy{position:absolute;inset:0;z-index:10;background:rgba(241,240,237,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-weight:600}
  .busy small{color:var(--muted);font-weight:500;font-size:13px}
  .busy .btn{margin-top:12px}
  .spin{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line2);border-top-color:var(--ink);animation:sp .8s linear infinite;margin-bottom:8px}
  .spin.sm{width:18px;height:18px;border-width:2px;margin:0}
  @keyframes sp{to{transform:rotate(360deg)}}
  .actions{display:flex;gap:8px;align-items:center;padding:12px 0}
  @media (max-height:680px){ .stage{min-height:170px} #view-outfit .vh{min-height:0;padding-bottom:8px} #view-outfit .vh h1{font-size:22px} #view-outfit .sub{display:none} .actions{padding:8px 0} .card{width:74px;height:90px} .tray-empty{height:90px} .chips{padding-bottom:8px} }
  .actions .btn{flex:1;min-width:0;padding:0 14px}
  @media (max-width:360px){ .round{width:44px;height:44px} .actions{gap:6px} .actions .btn{font-size:14px} }

  .tray{padding-bottom:10px}
  .tray-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 16px 4px;margin:0 -16px;touch-action:pan-x;scroll-padding:0 16px}
  .tray-row::-webkit-scrollbar{display:none}
  .card{flex:none;width:86px;height:108px;border-radius:18px;background:var(--paper);position:relative;padding:8px;border:2px solid transparent;transition:border-color .15s,transform .12s var(--ease);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .card:active{transform:scale(.96)}
  .card img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;pointer-events:none}
  .card.on{border-color:var(--ink)}
  .card.dragging{opacity:.35}
  .tick{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
  .tick .i{width:13px;height:13px;stroke-width:2.6}
  .card.alt{background:transparent;border:1.5px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
  .card .proc{position:absolute;inset:auto 6px 6px auto}
  .tray-empty{display:flex;align-items:center;justify-content:space-between;gap:12px;height:108px;padding:0 18px;border-radius:18px;border:1.5px dashed var(--line2);color:var(--muted);font-size:14px;flex:1}
  .drag-ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;width:96px;height:96px;object-fit:contain;background:var(--surface);border-radius:18px;padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.18);transition:opacity .15s}
  .drag-ghost.rm{opacity:.55;box-shadow:0 0 0 3px var(--danger),0 12px 32px rgba(0,0,0,.18)}

  /* ---------- wardrobe ---------- */
  .group{margin-bottom:22px}
  .group-h{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
  .group-h h2{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0}
  .group-h h2 span{color:var(--muted);font-weight:500;font-size:14px;margin-left:6px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  @media (max-width:340px){ .grid{grid-template-columns:repeat(2,1fr)} }
  .tile{position:relative;aspect-ratio:1;background:var(--paper);border-radius:18px;padding:10px;overflow:hidden;transition:transform .12s var(--ease)}
  .tile:active{transform:scale(.97)}
  .tile img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
  .tile.add{background:transparent;border:1.5px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:13px;font-weight:600}
  .badge{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:600;background:var(--surface);border-radius:99px;padding:3px 8px;display:inline-flex;align-items:center;gap:5px}
  .badge.err{color:var(--danger)}
  .tile .tick{top:8px;right:8px}
  .empty{text-align:center;color:var(--muted);padding:56px 24px;line-height:1.5;font-size:15px}
  .empty b{display:block;color:var(--ink);font-size:19px;letter-spacing:-.02em;margin-bottom:4px}
  .empty .btn{margin-top:18px}
  .hint{color:var(--muted);font-size:13px;line-height:1.5;margin:4px 2px 18px}

  /* ---------- looks ---------- */
  .looks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .look{position:relative;aspect-ratio:3/4;background:var(--paper);border-radius:20px;overflow:hidden;transition:transform .12s var(--ease)}
  .look:active{transform:scale(.98)}
  .look > img{width:100%;height:100%;object-fit:cover}
  .look .board{height:90%}
  .look .badge{left:10px;bottom:10px}

  /* ---------- me ---------- */
  .card-s{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:12px}
  .card-s h2{margin:0 0 4px;font-size:17px;letter-spacing:-.02em}
  .card-s p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.5}
  .me-row{display:flex;gap:16px;align-items:center}
  .me-pic{width:96px;aspect-ratio:3/4;border-radius:16px;background:var(--paper);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--muted)}
  .me-pic img{width:100%;height:100%;object-fit:cover}
  .me-row .col{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
  .tips{margin:12px 0 0;padding:0;list-style:none;color:var(--muted);font-size:13px;line-height:1.5}
  .tips li{padding-left:16px;position:relative}.tips li::before{content:"·";position:absolute;left:4px;font-weight:700}
  .field{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);padding:0 14px;background:var(--bg);margin-bottom:8px;outline:none;font-size:16px;color:var(--ink)}
  .field:focus{border-color:var(--ink)}
  .lbl{display:block;font-size:13px;font-weight:600;margin:4px 2px 6px}
  .spend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
  .spend div{background:var(--paper);border-radius:16px;padding:12px 14px}
  .spend b{display:block;font-size:22px;letter-spacing:-.03em;line-height:1.2}
  .spend small{display:block;color:var(--muted);font-size:12px;font-weight:600;line-height:1.4}
  .status{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:10px}
  .status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .status.ok::before{background:#2e9e5b}
  .status.warn::before{background:#d97a1e}
  .status.busy::before{background:#d9b21e;animation:blink 1s ease-in-out infinite}
  @keyframes blink{50%{opacity:.3}}
  .steps{margin:0 0 14px;padding-left:20px;color:var(--muted);font-size:14px;line-height:1.6}
  .steps b{color:var(--ink)}
  .field.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
  details{border-top:1px solid var(--line);margin-top:14px;padding-top:4px}
  summary{list-style:none;cursor:pointer;height:44px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";font-size:20px;font-weight:400;color:var(--muted)}
  details[open] summary::after{content:"–"}

  /* ---------- tab bar ---------- */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--tabh) + var(--sb));padding-bottom:var(--sb);background:rgba(250,250,249,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center}
  .tabs button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);transition:color .15s}
  .tabs button.on{color:var(--ink)}
  .tabs button .i{width:24px;height:24px}
  .tabs button.on .i{stroke-width:2.1}

  /* ---------- sheet ---------- */
  .scrim{position:fixed;inset:0;z-index:30;background:rgba(17,17,17,0);transition:background .24s var(--ease);display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
  .scrim.on{background:rgba(17,17,17,.38)}
  .sheet{position:relative;background:var(--surface);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:0 18px calc(var(--sb) + 18px);max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;transform:translateY(100%);transition:transform .28s var(--ease);outline:none}
  .scrim.on .sheet{transform:none}
  .sheet.drag{transition:none}
  .grab{height:26px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;position:sticky;top:0;background:var(--surface);z-index:2;margin:0 -18px}
  .grab::before{content:"";width:40px;height:5px;border-radius:5px;background:var(--line2)}
  .sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 -6px 10px 0;touch-action:none}
  .sh-head h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.025em}
  .sh-head .icon-btn{background:var(--paper)}
  .sheet .msg{color:var(--muted);line-height:1.5;margin:0 0 18px;font-size:15px}
  .sheet .row2{display:flex;gap:8px}.sheet .row2 .btn{flex:1}
  .stack{display:flex;flex-direction:column;gap:8px}
  .media{background:var(--paper);border-radius:22px;height:min(46vh,400px);height:min(46dvh,400px);display:flex;align-items:center;justify-content:center;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
  .media > img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
  .media.photo{padding:0}.media.photo > img{mix-blend-mode:normal;width:100%;height:100%}
  .media .board{height:94%}
    .sec-l{font-size:13px;font-weight:600;color:var(--muted);margin:16px 2px 8px}
  .cat-pick{display:flex;flex-wrap:wrap;gap:6px}
  .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .cat-grid .btn{height:56px;justify-content:flex-start;padding:0 18px;border-radius:18px}
  .menu{display:flex;flex-direction:column;margin:0 -6px}
  .menu button,.menu a{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 10px;border-radius:16px;text-align:left;text-decoration:none;font-weight:600}
  .menu button:active,.menu a:active{background:var(--paper)}
  .menu .ico{width:40px;height:40px;border-radius:12px;background:var(--paper);display:grid;place-items:center;flex:none}
  .menu small{display:block;color:var(--muted);font-weight:500;font-size:13px;margin-top:1px}
  .menu .danger{color:var(--danger)}

  /* ---------- snackbar ---------- */
  .snack{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--sb) + 12px);z-index:50;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:16px;padding:6px 6px 6px 16px;min-height:48px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;width:max-content;max-width:calc(100vw - 32px);box-shadow:0 8px 28px rgba(0,0,0,.2);transition:.24s var(--ease)}
  .snack.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .snack span{padding:6px 0}
  .snack button{flex:none;height:36px;padding:0 14px;border-radius:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.14)}
  .snack:not(:has(button)){padding-right:16px}

  @media (min-width:700px){
    .scrim{align-items:center}
    .sheet{border-radius:28px;max-height:86vh;padding-bottom:22px}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<main>
  <!-- OUTFIT -->
  <section class="view on" id="view-outfit" aria-label="Outfit">
    <header class="vh">
      <div><h1>Outfit</h1><p class="sub" id="outfitSub"></p></div>
      <div class="seg stage-seg" id="stageSeg" hidden><button data-m="board">Pieces</button><button data-m="me">On me</button></div>
    </header>
    <div class="stage" id="stage">
      <div class="board" id="board"></div>
      <img id="stageImg" alt="You wearing this outfit" hidden>
      <div class="stage-ph" id="stagePh" hidden></div>
      <div class="pager" id="verPager" hidden></div>
      <button class="expand" id="btnExpand" aria-label="View full screen" hidden><svg class="i s"><use href="#i-expand"/></svg></button>

<script>
(() => {
'use strict';

/* Try-on service URL (the Cloudflare Worker in /worker). Leave empty until deployed;
   it can also be set per device in Me → Advanced. */
const BUILTIN_ENDPOINT = 'https://outfits-tryon.aosmannur.workers.dev';

const CATS = [
  {id:'top',    label:'Tops',        one:'Top',       prompt:'the top (shirt, t-shirt, blouse or sweater)'},
  {id:'bottom', label:'Bottoms',     one:'Bottom',    prompt:'the bottoms (trousers, jeans, skirt or shorts)'},
  {id:'dress',  label:'Dresses',     one:'Dress',     prompt:'the one-piece (dress or jumpsuit); it replaces both the top and the bottoms'},
  {id:'outer',  label:'Outerwear',   one:'Outerwear', prompt:'the outer layer (jacket or coat), worn over the rest of the outfit'},
  {id:'shoes',  label:'Shoes',       one:'Shoes',     prompt:'the shoes'},
  {id:'bag',    label:'Bags',        one:'Bag',       prompt:'the bag, carried or worn naturally'},
  {id:'acc',    label:'Accessories', one:'Accessory', prompt:'an accessory (hat, jewelry, belt, scarf or sunglasses), worn naturally', multi:3},
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));
const catIdx = id => CATS.findIndex(c=>c.id===id);

/* ---------- dom helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(v===false||v==null) continue;
    if(k==='class') e.className=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  kids.flat(9).forEach(c=>c!=null&&c!==false&&e.append(c));
  return e;
}
function icon(n, cls='i'){
  const NS='http://www.w3.org/2000/svg', s=document.createElementNS(NS,'svg'), u=document.createElementNS(NS,'use');
  s.setAttribute('class',cls); s.setAttribute('aria-hidden','true'); u.setAttribute('href','#i-'+n); s.append(u); return s;
}
const B = (label, onclick, cls='', ic) => el('button',{class:'btn '+cls, onclick}, ic?icon(ic,'i s'):null, label);
const plural = (n, w) => `${n} ${w}${n===1?'':'s'}`;

/* ---------- storage ---------- */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('outfit-picker',1);
    r.onupgradeneeded = () => { const d=r.result;
      d.createObjectStore('items',{keyPath:'id'});
      d.createObjectStore('looks',{keyPath:'key'});
      d.createObjectStore('meta'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
const tx = (store, mode, fn) => new Promise((res,rej)=>{
  if(!db) return res(undefined);
  const t = db.transaction(store, mode); const out = fn(t.objectStore(store));
  t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
  t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
});
const rawPut = (store,val,key) => tx(store,'readwrite',s=>s.put(val,key));
const rawDel = (store,key) => tx(store,'readwrite',s=>s.delete(key));
const get = (store,key) => tx(store,'readonly',s=>s.get(key));
const getAll = store => tx(store,'readonly',s=>s.getAll());
const LS = { get(k,d=''){ try{return localStorage.getItem(k)??d}catch{return d} }, set(k,v){ try{localStorage.setItem(k,v)}catch{} }, del(k){ try{localStorage.removeItem(k)}catch{} } };
// Local changes get a timestamp (and deletions a tombstone) so cloud sync knows what is newer.
const tombs = () => { try{ const t=JSON.parse(LS.get('op_tomb','{}')); return {items:t.items||{}, looks:t.looks||{}}; }catch{ return {items:{},looks:{}}; } };
const put = (store,val,key) => {
  if(store==='items'||store==='looks'){ val.updated=Math.max(Date.now(), (val.updated||0)+1); scheduleSync(); }
  else if(store==='meta' && (key==='me'||key==='meId')){ LS.set('op_me_t', String(Date.now())); scheduleSync(); }
  return rawPut(store,val,key);
};
const del = (store,key) => {
  if(store==='items'||store==='looks'){ const t=tombs(); t[store][key]=Date.now(); LS.set('op_tomb', JSON.stringify(t)); scheduleSync(); }
  else if(store==='meta' && key==='me'){ LS.set('op_me_t', String(Date.now())); scheduleSync(); }
  return rawDel(store,key);
};

const cfg = {
  get key(){ return LS.get('op_key').trim(); },
  get model(){ return LS.get('op_model').trim() || 'gemini-2.5-flash-image'; },
  get endpoint(){ return (LS.get('op_endpoint').trim() || BUILTIN_ENDPOINT).replace(/\/+$/,''); },
  get code(){ return LS.get('op_code').trim(); },
  get mode(){
    if(LS.get('op_gen')==='key' && this.key) return 'key';
    if(this.endpoint) return 'service';
    return this.key ? 'key' : null;
  },
};

/* ---------- state ---------- */
let items = [];            // {id,cat,original,product,useOriginal,status,error,created}
const looks = new Map();   // key -> {key,items:[ids],image:Blob|null,created,saved}
let me = null;             // Blob
let outfit = (()=>{ try{ return JSON.parse(LS.get('op_outfit','[]'))||[]; }catch{ return []; } })();
let trayCat = CAT[LS.get('op_tray')] ? LS.get('op_tray') : 'top';
let stageMode = 'board';
let wardFilter = 'all';
const pending = new Map(); // look key -> AbortController
const pendingInfo = new Map(); // look key -> {title, sub}
let meId = null;           // id of the current "me" photo; try-ons remember which photo they were made from

const urlCache = new WeakMap();
const url = blob => { if(!blob) return ''; let u=urlCache.get(blob); if(!u){u=URL.createObjectURL(blob);urlCache.set(blob,u);} return u; };
const itemOf = id => items.find(i=>i.id===id);
const shown = it => (!it.useOriginal && it.product) || it.original;
const byCat = c => items.filter(i=>i.cat===c).sort((a,b)=>b.created-a.created);
const lookKey = ids => ids.length ? [...ids].sort().join('|') : null;
const curKey = () => lookKey(outfit);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const isSaved = l => !!(l && (l.saved || l.image));
// Every try-on photo of an outfit is kept as a version; l.image is the one being shown.
const vers = l => l?.versions?.length ? l.versions : (l?.image ? [{image:l.image, created:l.created, meId:l.meId, cost:l.cost}] : []);
const pickOf = l => { const v=vers(l); return Math.min(Math.max(0, l?.pick ?? v.length-1), Math.max(0, v.length-1)); };
const photoCount = () => [...looks.values()].reduce((n,l)=>n+vers(l).length, 0);
async function pickVersion(l, i){
  const v=vers(l); if(!v[i]) return;
  l.versions=v; l.pick=i; l.image=v[i].image; l.meId=v[i].meId; await putLook(l);
}
async function addVersion(k, ids, ver){
  const prev=looks.get(k), v=[...vers(prev), ver];
  await putLook({...(prev||{}), key:k, items:ids, versions:v, pick:v.length-1, image:ver.image, meId:ver.meId,
    created:prev?.created||Date.now(), saved:true, cost:(prev?.cost||0)+(ver.cost||0)});
}
async function deleteVersion(k){
  const l=looks.get(k); if(!l) return;
  const snap={...l, versions:[...vers(l)]}, v=[...vers(l)], i=pickOf(l);
  const gone=v.splice(i,1)[0]; l.vdel=[...(l.vdel||[]), gone.created];
  if(v.length){ l.versions=v; l.pick=Math.min(i, v.length-1); l.image=v[l.pick].image; l.meId=v[l.pick].meId; }
  else { l.versions=[]; l.pick=0; l.image=null; l.saved=true; }
  await putLook(l); renderAll();
  snack(v.length ? 'Version deleted' : 'Try-on photo deleted', 'Undo', async()=>{ await putLook(snap); renderAll(); });
}
function pagerEl(l, onChange){
  const v=vers(l), i=pickOf(l);
  if(v.length<2) return null;
  const go=async d=>{ await pickVersion(l, i+d); onChange?.(); };
  return el('div',{class:'pager'},
    el('button',{'aria-label':'Previous version',disabled:i===0||null,onclick:()=>go(-1)}, icon('left','i s')),
    el('span',{'aria-live':'polite'}, `${i+1}/${v.length}`),
    el('button',{'aria-label':'Next version',disabled:i===v.length-1||null,onclick:()=>go(1)}, icon('right','i s')));
}
function viewLook(l, onChange){
  const v=vers(l); if(!v.length) return;
  openViewer(v.map(x=>x.image), pickOf(l), async i=>{ await pickVersion(l, i); onChange?.(); });
}

/* ---------- snackbar ---------- */
let snackT;
function snack(msg, action, fn, ms){
  const s=$('#snack');
  s.replaceChildren(...[el('span',{},msg), action ? el('button',{onclick:()=>{ hideSnack(); fn(); }},action) : null].filter(Boolean));
  s.classList.add('on'); clearTimeout(snackT);
  snackT=setTimeout(hideSnack, ms || (action?5000:2600));
}
const hideSnack = () => $('#snack').classList.remove('on');
const toast = (m, ms) => snack(m, null, null, ms);

/* ---------- sheet (bottom sheet with scroll lock + swipe to close) ---------- */
let sheetCb=null, sheetTimer=null, locked=false, lockY=0;
function lockScroll(){ if(locked) return; locked=true; lockY=window.scrollY; document.body.style.top=`-${lockY}px`; document.documentElement.classList.add('locked'); }
function unlockScroll(){ if(!locked) return; locked=false; document.documentElement.classList.remove('locked'); document.body.style.top=''; window.scrollTo(0,lockY); }
function openSheet(nodes, opts={}){
  const sc=$('#scrim'), sh=$('#sheet');
  clearTimeout(sheetTimer);
  const head = opts.title ? el('div',{class:'sh-head'}, el('h2',{},opts.title),
    el('button',{class:'icon-btn','aria-label':'Close',onclick:closeSheet}, icon('x'))) : null;
  sh.replaceChildren(el('div',{class:'grab'}), head, ...nodes.flat().filter(Boolean));
  sh.style.transform=''; sh.scrollTop=0;
  sheetCb = opts.onClose || null;
  lockScroll();
  if(!sc.classList.contains('on')){ sc.hidden=false; void sc.offsetWidth; sc.classList.add('on'); }
  sh.focus({preventScroll:true});
}
function closeSheet(){
  const sc=$('#scrim'); if(!sc.classList.contains('on')) return;
  sc.classList.remove('on');
  const cb=sheetCb; sheetCb=null;
  sheetTimer=setTimeout(()=>{ sc.hidden=true; $('#sheet').style.transform=''; unlockScroll(); }, 260);
  cb?.();
}
$('#scrim').addEventListener('click', e=>{ if(e.target.id==='scrim') closeSheet(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });
// prevent scroll chaining to the page on iOS when the sheet itself cannot scroll
$('#scrim').addEventListener('touchmove', e=>{ if(!e.target.closest('.sheet')) e.preventDefault(); }, {passive:false});
(() => { // swipe down on handle/header to dismiss
  const sh=$('#sheet'); let y0=null, dy=0, pid=null;
  sh.addEventListener('pointerdown', e=>{
    if(!e.target.closest('.grab, .sh-head') || e.target.closest('button')) return;
    y0=e.clientY; dy=0; pid=e.pointerId; sh.classList.add('drag'); sh.setPointerCapture(pid);
  });
  sh.addEventListener('pointermove', e=>{ if(y0==null||e.pointerId!==pid) return; dy=Math.max(0,e.clientY-y0); sh.style.transform=`translateY(${dy}px)`; });
  const end = e=>{ if(y0==null||e.pointerId!==pid) return; y0=null; sh.classList.remove('drag');
    if(dy>90) closeSheet(); else sh.style.transform=''; };
  sh.addEventListener('pointerup', end); sh.addEventListener('pointercancel', end);
})();
function ask(title, msg, okLabel='Delete', danger=true){
  return new Promise(res=>{
    let done=false; const fin=v=>{ if(!done){ done=true; res(v); } };
    openSheet([ el('h2',{style:'margin:4px 0 8px;font-size:21px;letter-spacing:-.025em'},title), el('p',{class:'msg'},msg),
      el('div',{class:'row2'}, B('Cancel',()=>{ fin(false); closeSheet(); }), B(okLabel,()=>{ fin(true); closeSheet(); }, danger?'danger-fill':'primary')) ],
      {onClose:()=>fin(false)});
  });
}
function seg(options, value, onChange, cls=''){
  const w = el('div',{class:'seg '+cls});
  for(const [v,l] of options) w.append(el('button',{class:v===value?'on':'', 'data-v':v, onclick:()=>{
    w.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v===v)); onChange(v);
  }}, l));
  return w;
}

/* ---------- images ---------- */
function loadImg(blob){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('Could not read that image')); i.src=URL.createObjectURL(blob); }); }
async function shrink(blob, max=1280, q=0.9){
  const img = await loadImg(blob);
  const s = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
  const c = document.createElement('canvas'); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(img.src);
  return new Promise(r=>c.toBlob(r,'image/jpeg',q));
}
const toB64 = blob => new Promise((res,rej)=>{ const f=new FileReader(); f.onload=()=>res(String(f.result).split(',')[1]); f.onerror=()=>rej(f.error); f.readAsDataURL(blob); });
function b64ToBlob(b64, mime='image/png'){ const bin=atob(b64); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return new Blob([a],{type:mime}); }
function download(blob, name){ const a=el('a',{href:URL.createObjectURL(blob),download:name}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); }

/* ---------- on-device background removal ---------- */
let bgLib=null, bgToast=false;
const getBg = () => bgLib ||= import('./bg.js');
async function framed(cutBlob){
  const img = await loadImg(cutBlob);
  const W=img.naturalWidth, H=img.naturalHeight, sc=Math.min(1,512/Math.max(W,H));
  const a=document.createElement('canvas'); a.width=Math.max(1,Math.round(W*sc)); a.height=Math.max(1,Math.round(H*sc));
  const ag=a.getContext('2d'); ag.drawImage(img,0,0,a.width,a.height);
  const d=ag.getImageData(0,0,a.width,a.height).data;
  let x0=a.width,y0=a.height,x1=-1,y1=-1;
  for(let y=0;y<a.height;y++) for(let x=0;x<a.width;x++) if(d[(y*a.width+x)*4+3]>24){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  if(x1<0) throw new Error('Could not find the item in that photo');
  const bx=x0/sc, by=y0/sc, bw=(x1-x0+1)/sc, bh=(y1-y0+1)/sc;
  const side=Math.min(1024,Math.round(Math.max(bw,bh)*1.12)), k=side/(Math.max(bw,bh)*1.12);
  const c=document.createElement('canvas'); c.width=c.height=side;
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,side,side);
  g.drawImage(img,bx,by,bw,bh,(side-bw*k)/2,(side-bh*k)/2,bw*k,bh*k);
  URL.revokeObjectURL(img.src);
  return new Promise(r=>c.toBlob(r,'image/jpeg',0.92));
}

const sortIds = ids => ids.slice().sort((a,b)=>catIdx(itemOf(a).cat)-catIdx(itemOf(b).cat));
function withItem(ids, id){
  const it=itemOf(id); const removed=[];
  let next = ids.filter(x=>{
    if(x===id) return false; const o=itemOf(x); if(!o) return false;
    const crossClash = (it.cat==='dress' && (o.cat==='top'||o.cat==='bottom')) || ((it.cat==='top'||it.cat==='bottom') && o.cat==='dress');
    const sameSlot = o.cat===it.cat && !CAT[it.cat].multi;
    if(crossClash) removed.push(o);
    return !(crossClash || sameSlot);
  });
  const m=CAT[it.cat].multi;
  if(m){ const same=next.filter(x=>itemOf(x).cat===it.cat); while(same.length>=m){ const drop=same.shift(); next=next.filter(x=>x!==drop); removed.push(itemOf(drop)); } }
  next.push(id);

}

function shuffle(){
  let cats=[...new Set(outfit.map(id=>itemOf(id)?.cat).filter(Boolean))];
  if(!cats.length) cats=['top','bottom','shoes'].filter(c=>byCat(c).length);
  if(!cats.length) return toast('Add some clothes to your wardrobe first');
  const next=[];
  for(const c of cats){
    const list=byCat(c); const cur=outfit.filter(id=>itemOf(id)?.cat===c);
    const want=Math.max(1,cur.length);
    const pool=list.length>want ? list.filter(i=>!cur.includes(i.id)) : list;
    const picks=[...pool].sort(()=>Math.random()-.5).slice(0,want);
    if(picks.length<want) picks.push(...list.filter(i=>!picks.includes(i)).slice(0,want-picks.length));
    next.push(...picks.map(i=>i.id));
  }
  stageMode='board'; setOutfit(enforce(next));
}

/* ---------- flat-lay board ---------- */
function layout(ids){
  const P={}; for(const id of ids){ const it=itemOf(id); if(it) (P[it.cat] ||= []).push(it); }
  const one=c=>P[c]?.[0];
  let outer=one('outer'); const top=one('top'), bottom=one('bottom'), dress=one('dress'), shoes=one('shoes'), bag=one('bag'), accs=P.acc||[];
  const all=Object.values(P).flat();
  const hasMain = !!(top||bottom||dress);
  let mainOuter=null; if(outer && !hasMain){ mainOuter=outer; outer=null; }
  const column = hasMain || mainOuter;
  const out=[]; const add=(it,x,y,w,h,z)=>out.push({it,x,y,w,h,z});
  if(!column && !shoes){ // only bags / accessories: simple grid
    const cols=all.length>1?2:1, rows=Math.ceil(all.length/cols);
    all.forEach((it,i)=>add(it, 4+(i%cols)*(92/cols), 4+Math.floor(i/cols)*(92/rows), 92/cols, 92/rows, 1));
    return out;
  }
  const side = !!(bag || accs.length);
  const x0 = outer ? 28 : (side ? 4 : 10), x1 = side ? 72 : (outer ? 98 : 90), w = x1-x0;
  const bottomEdge = shoes ? 79 : 97, H = bottomEdge-2;
  if(outer) add(outer, 0, 4, 52, 56, 1);
  if(dress) add(dress, x0, 2, w, H, 2);
  else if(top && bottom){ add(bottom, x0+w*.07, 2+H*.43, w*.86, H*.57, 2); add(top, x0, 2, w, H*.47, 3); }
  else if(top||bottom||mainOuter) add(top||bottom||mainOuter, x0, 2, w, H, 2);
  if(shoes) column ? add(shoes, x0+w*.16, 81, w*.68, 17, 4) : add(shoes, x0, 18, w, 64, 4);
  if(bag) add(bag, 70, accs.length?54:44, 30, 34, 5);
  accs.forEach((a,i)=>add(a, 74, 3+i*16.5, 24, 15, 6));
  return out;
}

let D=null, suppressUntil=0;
const dragSuppressed = () => Date.now() < suppressUntil;
function dragDown(e, id, from, src){
  if(e.button>0 || D) return;
  D={id, from, src, pid:e.pointerId, sx:e.clientX, sy:e.clientY, x:e.clientX, y:e.clientY, active:false, timer:null};
  if(from==='stage') D.timer=setTimeout(()=>{ if(D && !D.active) dragBegin(); }, e.pointerType==='mouse'?120:280);
}
function overStage(){ const r=$('#stage').getBoundingClientRect(); return D.x>=r.left && D.x<=r.right && D.y>=r.top && D.y<=r.bottom; }
function dragBegin(){
  clearTimeout(D.timer); D.active=true;
  const img=D.src.tagName==='IMG'?D.src:D.src.querySelector('img');
  D.ghost=el('img',{class:'drag-ghost', src:img.src, alt:''}); document.body.append(D.ghost);
  D.src.classList.add('dragging');
  $('#stage').classList.add(D.from==='tray'?'dnd-add':'dnd-remove');
  $('#dropHint').textContent = D.from==='tray' ? 'Drop to add' : 'Drag out to remove';
  navigator.vibrate?.(8);

}
function dragMove(){
  const over=overStage();
  D.ghost.style.transform=`translate(${D.x-48}px,${D.y-70}px) scale(1.04)`;
  D.ghost.classList.toggle('rm', D.from==='stage' && !over);
  $('#stage').classList.toggle('over', over);
}
function dragEnd(drop){
  const d=D; if(!d) return;
  const over = d.active && overStage();
  D=null; clearTimeout(d.timer);
  if(!d.active) return;
  suppressUntil=Date.now()+400;
  d.ghost.remove(); d.src.classList.remove('dragging');
  $('#stage').classList.remove('dnd-add','dnd-remove','over');
  if(!drop) return;
  if(d.from==='tray' && over) addPiece(d.id);
  else if(d.from==='stage' && !over) removePiece(d.id);
}
window.addEventListener('pointermove', e=>{
  if(!D || e.pointerId!==D.pid) return;
  D.x=e.clientX; D.y=e.clientY; const dx=D.x-D.sx, dy=D.y-D.sy;
  if(!D.active){
    if(D.from==='tray'){
      if(dy<-12 && Math.abs(dy)>Math.abs(dx)*1.2) dragBegin();
      else if(Math.abs(dx)>10 || dy>14) dragEnd(false);
    } else if(Math.hypot(dx,dy)>8){
      if(e.pointerType==='mouse') dragBegin(); else dragEnd(false);
    }
    return;
  }
  dragMove();
});

function costOf(model, usage, nImages){

/* ---------- "change one piece": edit the closest earlier try-on instead of starting over ---------- */
const NAME = {top:'top', bottom:'bottoms', dress:'dress', outer:'jacket or coat', shoes:'shoes', bag:'bag', acc:'accessory'};
const MUST_HAVE = new Set(['top','bottom','dress','shoes']); // removing these without a replacement needs a fresh try-on
function planEdit(baseIds, targetIds){
  const added=targetIds.filter(id=>!baseIds.includes(id)).map(itemOf), removed=baseIds.filter(id=>!targetIds.includes(id)).map(itemOf);
  if(added.some(x=>!x) || removed.some(x=>!x)) return null;
  const rem=removed.map(it=>it.cat), take=c=>{ const i=rem.indexOf(c); if(i<0) return false; rem.splice(i,1); return true; };
  const add=added.map(it=>{
    let replaces=[];
    if(take(it.cat)) replaces=[it.cat];
    else if(it.cat==='dress') replaces=['top','bottom'].filter(take);
    else if(it.cat==='top'||it.cat==='bottom'){ if(take('dress')) replaces=['dress']; }
    return {id:it.id, cat:it.cat, replaces};
  });
  if(rem.some(c=>MUST_HAVE.has(c))) return null;
  const changes=add.length+rem.length, kept=targetIds.filter(id=>baseIds.includes(id)).length;
  if(!changes || add.length>2 || changes>3 || !kept) return null;
  return {add, remove:rem, changes};
}
function findBase(ids){
  const k=lookKey(ids); let best=null;
  for(const l of looks.values()){
    if(!l.image || l.key===k || !meId || l.meId!==meId) continue;
    const plan=planEdit(l.items, ids); if(!plan) continue;
    if(!best || plan.changes<best.plan.changes || (plan.changes===best.plan.changes && l.created>best.look.created)) best={look:l, plan};
  }
  return best;
}

        : `- Add the ${what} shown in image ${n}${a.cat==='outer'?', worn over the rest of the outfit':''}.`; }),
    ...plan.remove.map(c=>`- Remove their ${NAME[c]}.`),
  ].join('\n');
}

  }

    const img=(t,d)=>[{text:t},{inline_data:{mime_type:'image/jpeg',data:d}}];
    const parts = base
      ? [{text:editPrompt(base.plan)}, ...img('Image 1 — current photo:',baseImg), ...img('Image 2 — the person (reference):',person),
         ...pieces.flatMap((p,i)=>img(`Image ${i+3} — new ${NAME[p.cat]}:`,p.image))]
      : [{text:buildPrompt(pieces.map(p=>p.cat))}, ...img('Image 1 — the person:',person),
         ...pieces.flatMap((p,i)=>img(`Image ${i+2} — ${CAT[p.cat].one.toLowerCase()}:`,p.image))];
    const {blob, usage}=await geminiDirect(parts, signal);
    return {blob, cost:costOf(cfg.model, usage, nImages)};
  }

}
async function geminiDirect(parts, signal){
  const endpoint=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.model)}:generateContent`;
  const call=async withCfg=>{
    const generationConfig = withCfg ? {responseModalities:['IMAGE'], imageConfig:{aspectRatio:'3:4'}} : {responseModalities:['TEXT','IMAGE']};
    const r=await fetch(endpoint,{method:'POST',signal,headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key},body:JSON.stringify({contents:[{role:'user',parts}],generationConfig})});
    return {r, j: await r.json().catch(()=>({}))};
  };
  let {r,j}=await call(true);
  if(r.status===400 && !/API key/i.test(j?.error?.message||'')) ({r,j}=await call(false));
  if(!r.ok){
    const m=j?.error?.message||`HTTP ${r.status}`;
    if(r.status===429 && /limit: ?0\b|free_tier/i.test(m)) throw new Error('Gemini image generation has no free tier. Turn on billing for your key in Google AI Studio.');
    if(r.status===429) throw new Error('Gemini is busy or your quota is used up. Try again in a minute.');
    if(r.status===400 && /API key/i.test(m)) throw new Error('That API key was rejected. Check it in the Me tab.');
    throw new Error(m);
  }
  const cand=j.candidates?.[0], p=cand?.content?.parts?.find(p=>p.inlineData||p.inline_data);
  if(!p){
    const txt=cand?.content?.parts?.find(p=>p.text)?.text, why=j.promptFeedback?.blockReason||cand?.finishReason;
    throw new Error(txt ? 'Gemini replied: '+txt.slice(0,160) : 'No image came back'+(why?` (${why})`:'')+'. Try again.');
  }
  const d=p.inlineData||p.inline_data, u=j.usageMetadata;
  return {blob:b64ToBlob(d.data, d.mimeType||d.mime_type||'image/png'), usage:u?{in:u.promptTokenCount||0, out:u.candidatesTokenCount||0}:null};
}

function collageText(its){
  return `Make a realistic full-body photo of the PERSON on the left wearing exactly the items on the right (${its.map(it=>CAT[it.cat].one.toLowerCase()).join(', ')}). Keep the same face, hair, skin tone and body. Same colors and details on each item. Keep any part of their current outfit that is not replaced, and add nothing else. Head to feet visible, standing, facing the camera, plain light-grey background, portrait 3:4.`;
}
function wrapLines(g, text, maxW){
  const out=[]; let line='';
  for(const w of text.split(' ')){ const t=line?line+' '+w:w; if(g.measureText(t).width>maxW && line){ out.push(line); line=w; } else line=t; }
  if(line) out.push(line); return out;
}
async function drawContain(g, blob, x, y, w, h){
  const im=await loadImg(blob), s=Math.min(w/im.naturalWidth, h/im.naturalHeight), dw=im.naturalWidth*s, dh=im.naturalHeight*s;
  g.drawImage(im, x+(w-dw)/2, y+(h-dh)/2, dw, dh); URL.revokeObjectURL(im.src);
}
async function buildCollage(ids){
  const its=ids.map(itemOf).filter(Boolean);
  const W=1500, BODY=1200, FONT='600 30px Inter, Helvetica, Arial, sans-serif';
  const m=document.createElement('canvas').getContext('2d'); m.font=FONT;
  const lines=wrapLines(m, collageText(its), W-48), HEAD=40+lines.length*40+24;
  const c=document.createElement('canvas'); c.width=W; c.height=HEAD+BODY;
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,W,c.height);
  g.fillStyle='#111'; g.font=FONT; lines.forEach((l,i)=>g.fillText(l, 24, 48+i*40));
  g.fillStyle='#e5e5e5'; g.fillRect(0,HEAD-10,W,3);
  if(me) await drawContain(g, me, 0, HEAD+50, 840, BODY-60);
  g.fillStyle='#e5e5e5'; g.fillRect(858,HEAD,3,BODY);
  g.fillStyle='#111'; g.font='700 26px Inter, Helvetica, Arial, sans-serif'; g.fillText('PERSON', 24, HEAD+38);
  const n=its.length, cols=n>4?2:1, rows=Math.ceil(n/cols), cw=600/cols, ch=BODY/rows;
  for(let i=0;i<n;i++){
    const x=880+(i%cols)*cw, y=HEAD+Math.floor(i/cols)*ch;
    g.fillStyle='#111'; g.fillText(CAT[its[i].cat].one.toUpperCase(), x+4, y+36);
    await drawContain(g, shown(its[i]), x, y+48, cw-20, ch-60);
  }
  const png=await new Promise(r=>c.toBlob(r,'image/png'));
  const jpg=await new Promise(r=>c.toBlob(r,'image/jpeg',0.92));
  return {png, file:new File([jpg],'outfit.jpg',{type:'image/jpeg'})};
}

      else { if(!g.axis && g.moved) g.axis = Math.abs(dx)>Math.abs(dy) && list.length>1 ? 'x' : 'y';
        if(g.axis==='x'){ tx=dx; ty=0; apply(); }
        else if(g.axis==='y'){ ty=Math.max(0,dy); tx=0; apply(); v.style.background=`rgba(10,10,10,${1-Math.min(.7,ty/400)})`; } } } });
  const up=e=>{ if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
    if(g && !g.pinch){
      if(s<=1.01 && g.axis==='y' && ty>110){ close(); return; }
      if(s<=1.01 && g.axis==='x' && Math.abs(tx)>60){ const moved=goTo(cur+(tx<0?1:-1)); tx=0; ty=0; if(!moved) anim(); apply(); g=null; return; }
      if(!g.moved){ const now=Date.now();
        if(now-lastTap<300){ lastTap=0; const c=center();
          if(s>1.01){ s=1; tx=0; ty=0; } else { s=2.5; tx=-(g.p0.x-c.x)*1.5; ty=-(g.p0.y-c.y)*1.5; bound(); }
          v.style.background=''; anim(); apply(); g=null; return; }
        lastTap=now; } }
    if(s<1.05){ s=1; tx=0; ty=0; } else bound();
    v.style.background=''; anim(); apply();
    if(pts.size) start(); else g=null; };
  v.addEventListener('pointerup', up); v.addEventListener('pointercancel', up);
  v.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
  const key=e=>{ if(e.key==='Escape'){ e.stopImmediatePropagation(); close(); }
    else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){ if(goTo(cur+(e.key==='ArrowRight'?1:-1))){ s=1; tx=0; ty=0; apply(); } } };
  document.addEventListener('keydown', key, true);
  function close(){ if(!viewerClose) return; viewerClose=null; document.removeEventListener('keydown', key, true);
    v.classList.remove('on'); setTimeout(()=>v.remove(),220); if(!wasLocked) unlockScroll(); }
  viewerClose=close;
  v.querySelector('.vbtn').focus({preventScroll:true});
}

/* ---------- backup / restore (one JSON file, images embedded) ---------- */
const enc = async b => b ? {t:b.type||'image/jpeg', d:await toB64(b)} : null;
const dec = o => o?.d ? b64ToBlob(o.d, o.t||'image/jpeg') : null;
async function backup(){
  const btn=$('#btnBackup'); btn.disabled=true; const label=btn.lastChild.textContent; btn.lastChild.textContent='Preparing…';
  try{
    const parts=['{"app":"outfits","v":1,"created":',String(Date.now()),',"meId":',JSON.stringify(meId),',"me":',JSON.stringify(await enc(me)),
      ',"outfit":',JSON.stringify(outfit),',"spend":',JSON.stringify(spendLog()),',"items":['];
    let first=true;
    for(const it of items){ parts.push((first?'':',')+JSON.stringify({...it, original:await enc(it.original), product:await enc(it.product)})); first=false; }
    parts.push('],"looks":['); first=true;
    for(const l of looks.values()){
      const v=await Promise.all(vers(l).map(async x=>({...x, image:await enc(x.image)})));
      parts.push((first?'':',')+JSON.stringify({...l, image:null, versions:v})); first=false;
    }
    parts.push(']}');
    const name=`outfits-backup-${new Date().toISOString().slice(0,10)}.json`;
    const file=new File(parts,name,{type:'application/json'});
    let done=false;
    if(navigator.canShare?.({files:[file]})){
      try{ await navigator.share({files:[file]}); done=true; }catch(e){ if(e.name==='AbortError') return; }
    }
    if(!done) download(file, name);
    LS.set('op_lastBackup', String(Date.now())); renderMe();
    toast(`Backup ready · ${file.size<1048576 ? Math.max(1,Math.round(file.size/1024))+' KB' : (file.size/1048576).toFixed(1)+' MB'}`);
  }catch(e){ toast('Backup failed: '+e.message, 4000); }
  finally{ btn.disabled=false; btn.lastChild.textContent=label; }
}
async function restore(file){
  let data;
  try{ data=JSON.parse(await file.text()); }catch{ return toast('That file isn’t an Outfits backup.', 4000); }
  if(data?.app!=='outfits' || !Array.isArray(data.items)) return toast('That file isn’t an Outfits backup.', 4000);
  const nLooks=(data.looks||[]).length;
  if(!await ask('Restore this backup?', `It has ${plural(data.items.length,'item')} and ${plural(nLooks,'look')}. They’re added to what’s on this device. Nothing here is deleted.`, 'Restore', false)) return;
  toast('Restoring…', 60000);
  try{
    const have=new Set(items.map(i=>i.id));
    for(const it of data.items){ if(have.has(it.id)) continue; await put('items',{...it, original:dec(it.original), product:dec(it.product)}); }
    for(const bl of data.looks||[]){
      const v=(bl.versions||[]).map(x=>({...x, image:dec(x.image)})).filter(x=>x.image);
      const cur=looks.get(bl.key), mine=vers(cur), seen=new Set(mine.map(x=>x.created));
      const merged=[...mine, ...v.filter(x=>!seen.has(x.created))].sort((a,b)=>a.created-b.created);
      const pickImg = cur?.image || v[Math.min(bl.pick??v.length-1, v.length-1)]?.image || null;
      const pick=Math.max(0, merged.findIndex(x=>x.image===pickImg));
      await put('looks',{...bl, ...(cur||{}), versions:merged, pick, image:merged[pick]?.image||null, meId:merged[pick]?.meId||bl.meId||null,
        saved:true, created:Math.min(cur?.created||Infinity, bl.created||Date.now())});
    }
    if(!me && data.me){ await put('meta',dec(data.me),'me'); if(data.meId) await put('meta',data.meId,'meId'); }
    if(Array.isArray(data.spend)){ const log=spendLog(), seen=new Set(log.map(x=>x.t)); LS.set('op_spend', JSON.stringify([...log, ...data.spend.filter(x=>!seen.has(x.t))].sort((a,b)=>a.t-b.t))); }
    if(!outfit.length && Array.isArray(data.outfit)) LS.set('op_outfit', JSON.stringify(data.outfit));
    LS.set('op_restored', '1');
    location.reload();
  }catch(e){ toast('Restore failed: '+e.message, 5000); }
}

/* ---------- cloud sync (Worker + R2) and the Claude connector ---------- */
const SYNC = { get code(){ return LS.get('op_sync').trim(); }, get on(){ return !!(this.code && cfg.endpoint); } };
let syncBusy=false, syncAgain=false, syncTimer=null, syncErr='', applying=false;
const hashCache=new WeakMap(), thumbCache=new WeakMap();
async function hashOf(blob){
  let h=hashCache.get(blob);
  if(!h){ const d=await crypto.subtle.digest('SHA-256', await blob.arrayBuffer()); h=[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join(''); hashCache.set(blob,h); }
  return h;
}
async function thumbOf(blob){ let t=thumbCache.get(blob); if(!t){ t=await shrink(blob,320,.8); thumbCache.set(blob,t); } return t; }
const tsOf = r => (r && r.updated) || 0;
async function syncFetch(path, opts={}, code=SYNC.code){
  const r=await fetch(cfg.endpoint+path, {...opts, headers:{Authorization:'Bearer '+code, ...(opts.headers||{})}});
  if(!r.ok){ const j=await r.json().catch(()=>({})); const e=new Error(j.error||`Sync failed (${r.status})`); e.status=r.status; throw e; }
  return r;
}
const syncJSON = (path, body, code) => syncFetch(path, body===undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}, code).then(r=>r.json());
function scheduleSync(ms=6000){ if(!SYNC.on || applying) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(), ms); }

async function syncNow(){
  if(!SYNC.on) return;
  if(syncBusy){ syncAgain=true; return; }
  clearTimeout(syncTimer); syncBusy=true; syncErr=''; renderSyncStatus();
  try{
    const remote=await syncJSON('/sync/state');
    remote.items=remote.items||{}; remote.looks=remote.looks||{};
    const ch={items:{}, looks:{}}, up=new Map(), tomb=tombs();
    const blob=async b=>{ if(!b) return null; const h=await hashOf(b); up.set(h,b); return h; };
    for(const it of items){
      const lu=it.updated||it.created||1;
      if(lu<=tsOf(remote.items[it.id])) continue;
      ch.items[it.id]={id:it.id, cat:it.cat, useOriginal:!!it.useOriginal, status:it.status, error:it.error||'', created:it.created, updated:lu, desc:it.desc||'',
        ho:await blob(it.original), hp:await blob(it.product), ht:await blob(await thumbOf(shown(it)))};
    }
    for(const [id,t] of Object.entries(tomb.items)) if(!itemOf(id) && t>tsOf(remote.items[id])) ch.items[id]={id, deleted:true, updated:t};
    for(const l of looks.values()){
      const r=remote.looks[l.key], lu=l.updated||l.created||1, lv=vers(l), rv=new Set((r?.versions||[]).map(v=>v.created));
      if(lu<=tsOf(r) && (r.deleted || lv.every(v=>rv.has(v.created)))) continue;
      const v=[]; for(const x of lv) v.push({created:x.created, h:await blob(x.image), meId:x.meId||null, cost:x.cost||0, from:x.from||null, imported:!!x.imported, by:x.by||null});
      ch.looks[l.key]={key:l.key, items:l.items, saved:!!l.saved, created:l.created, updated:lu, note:l.note||'', by:l.by||null, cost:l.cost||0,
        versions:v, vdel:l.vdel||[], pickCreated:lv[pickOf(l)]?.created||null};
    }
    for(const [k,t] of Object.entries(tomb.looks)) if(!looks.has(k) && t>tsOf(remote.looks[k])) ch.looks[k]={key:k, deleted:true, updated:t};
    // A photo saved before sync existed has no change time; treat it as oldest so it uploads
    // unless another device already uploaded one.
    const meT = +LS.get('op_me_t','0') || (me ? 1 : 0);
    if(meT && meT>tsOf(remote.me)) ch.me = me ? {h:await blob(me), meId, updated:meT} : {deleted:true, updated:meT};
    const rs=new Set((remote.spend||[]).map(x=>x.t)), newSpend=spendLog().filter(x=>!rs.has(x.t));
    if(newSpend.length) ch.spend=newSpend;

    let state=remote;
    if(Object.keys(ch.items).length || Object.keys(ch.looks).length || ch.me || ch.spend){
      const hashes=[...up.keys()];
      for(let i=0;i<hashes.length;i+=1000){
        const {missing}=await syncJSON('/sync/missing',{hashes:hashes.slice(i,i+1000)});
        for(const h of missing){ const b=up.get(h); await syncFetch('/sync/blob/'+h, {method:'PUT', headers:{'Content-Type':/^image\/(jpeg|png|webp)$/.test(b.type)?b.type:'image/jpeg'}, body:b}); }
      }
      state=await syncJSON('/sync/push', ch);
    }
    await applyRemote(state);
    LS.set('op_sync_at', String(Date.now()));
  }catch(e){
    syncErr = e.status===401 ? 'This sync code isn’t recognised.' : e.status===501 ? 'The service doesn’t have sync set up yet.' : (e.message||'Sync failed');
  }finally{
    syncBusy=false; renderSyncStatus();
    if(syncAgain){ syncAgain=false; scheduleSync(1500); }
  }
}
async function applyRemote(state){
  applying=true; let changed=false;
  try{
    const known=new Map(); let indexed=false;
    const blobFor=async h=>{
      if(!h) return null;
      if(!indexed){ indexed=true;
        const all=[me, ...items.flatMap(i=>[i.original,i.product]), ...[...looks.values()].flatMap(l=>vers(l).map(v=>v.image))].filter(Boolean);
        for(const b of all) known.set(await hashOf(b), b); }
      let b=known.get(h);
      if(!b){ b=await (await syncFetch('/sync/blob/'+h)).blob(); known.set(h,b); hashCache.set(b,h); }
      return b;
    };
    const tomb=tombs();
    for(const [id,r] of Object.entries(state.items||{})){
      const loc=itemOf(id), lu=loc ? (loc.updated||loc.created||1) : 0;
      if(r.deleted){ if(loc && tsOf(r)>=lu){ await rawDel('items',id); items=items.filter(i=>i.id!==id); changed=true; } continue; }
      if(loc ? tsOf(r)<=lu : (tomb.items[id]||0)>=tsOf(r)) continue;
      const rec={id, cat:CAT[r.cat]?r.cat:'top', useOriginal:!!r.useOriginal, status:r.status||'ok', error:r.error||'', created:r.created||Date.now(), updated:tsOf(r), desc:r.desc||'',
        original:await blobFor(r.ho), product:await blobFor(r.hp)};
      if(!rec.original && !rec.product) continue;
      if(loc) Object.assign(loc, rec); else items.push(rec);
      await rawPut('items', loc||rec); changed=true;
    }
    for(const [k,r] of Object.entries(state.looks||{})){
      const loc=looks.get(k), lu=loc ? (loc.updated||loc.created||1) : 0;
      if(r.deleted){ if(loc && tsOf(r)>=lu){ await rawDel('looks',k); looks.delete(k); changed=true; } continue; }
      if(loc ? tsOf(r)<=lu : (tomb.looks[k]||0)>=tsOf(r)) continue;
      const v=[];
      for(const x of r.versions||[]){ const b=await blobFor(x.h); if(b) v.push({image:b, created:x.created, meId:x.meId||null, cost:x.cost||0, from:x.from||null, imported:!!x.imported, by:x.by||null}); }
      let pick=v.findIndex(x=>x.created===r.pickCreated); if(pick<0) pick=v.length-1; pick=Math.max(0,pick);
      const rec={key:k, items:r.items||[], saved:r.saved!==false, created:r.created||Date.now(), updated:tsOf(r), note:r.note||'', by:r.by||null, cost:r.cost||0,
        vdel:r.vdel||[], versions:v, pick, image:v[pick]?.image||null, meId:v[pick]?.meId||null};
      await rawPut('looks', rec); looks.set(k, rec); changed=true;
    }
    const meT=+LS.get('op_me_t','0');
    if(state.me && tsOf(state.me)>meT){
      if(state.me.deleted){ await rawDel('meta','me'); await rawDel('meta','meId'); me=null; meId=null; }
      else { const b=await blobFor(state.me.h); if(b){ await rawPut('meta',b,'me'); me=b; if(state.me.meId){ meId=state.me.meId; await rawPut('meta',meId,'meId'); } } }
      LS.set('op_me_t', String(tsOf(state.me))); collageCache=null; changed=true;
    }
    if(Array.isArray(state.spend) && state.spend.length){
      const log=spendLog(), seen=new Set(log.map(x=>x.t)), add=state.spend.filter(x=>x && x.t && !seen.has(x.t));
      if(add.length){ LS.set('op_spend', JSON.stringify([...log, ...add].sort((a,b)=>a.t-b.t).slice(-2000))); changed=true; }
    }
  }finally{ applying=false; }
  if(changed){
    const o=enforce(outfit.filter(id=>itemOf(id)));
    if(o.length!==outfit.length){ outfit=o; LS.set('op_outfit', JSON.stringify(o)); }
    renderAll();
  }
}

const agoShort = t => { const s=(Date.now()-t)/1000; return s<60?'just now':s<3600?`${Math.floor(s/60)} min ago`:s<86400?`${Math.floor(s/3600)} h ago`:ago(t); };
function syncStatusText(){

}

async function enableSync(){

}
function joinSheet(){
  const inp=el('input',{class:'field mono',placeholder:'Paste your sync code',autocomplete:'off',autocapitalize:'off',spellcheck:'false'});
  openSheet([el('p',{class:'msg'},'Find the code on your other device: Me → Sync & Claude → Use on another device. Your clothes on this device are kept and merged with the synced ones.'),
    inp, el('div',{class:'stack',style:'margin-top:8px'}, B('Connect', async()=>{
      const code=inp.value.trim(); if(!code) return;
      try{ await syncJSON('/sync/state', undefined, code); }
      catch(e){ return toast(e.status===401 ? 'That code isn’t recognised.' : 'Couldn’t reach the service.', 4000); }
      LS.set('op_sync', code); LS.del('op_sync_at'); closeSheet(); renderMe(); toast('Connected. Syncing…'); syncNow();
    }, 'primary'))], {title:'Use a sync code'});
}
function codeSheet(){
  openSheet([el('p',{class:'msg'},'On your other phone or computer, open this app → Me → Sync & Claude → I have a sync code, and paste this:'),
    el('input',{class:'field mono',value:SYNC.code,readonly:true,onclick:e=>e.target.select()}),
    el('p',{class:'msg',style:'font-size:13px'},'Anyone with this code can see and change your wardrobe. Keep it private.'),
    el('div',{class:'stack'}, B('Copy code', ()=>copyText(SYNC.code,'Sync code copied'), 'primary', 'copy'))], {title:'Use on another device'});
}
async function disableSync(){
  if(!await ask('Turn off sync on this device?','Your wardrobe stays on this device and in the cloud. You can reconnect later with your sync code.','Turn off')) return;
  LS.del('op_sync'); LS.del('op_sync_at'); LS.del('op_mcp_url'); syncErr=''; renderMe(); toast('Sync turned off on this device');
}
function connectSheet(){
  const url=LS.get('op_mcp_url');
  const make=async()=>{
    try{ const {url}=await syncJSON('/sync/connector', {}); LS.set('op_mcp_url', url); connectSheet(); }
    catch(e){ toast(e.message, 4000); }
  };
  const revoke=async()=>{
    if(!await ask('Turn off Claude access?','The connector link stops working. You can make a new one any time.','Turn off')) return;
    try{ await syncFetch('/sync/connector',{method:'DELETE'}); LS.del('op_mcp_url'); toast('Claude access turned off'); }
    catch(e){ toast(e.message, 4000); }
  };
  if(!url){
    openSheet([el('p',{class:'msg'},'Let Claude see your wardrobe, suggest outfits, save them to your Looks and make try-on photos when you ask. You’ll get a private link to add in Claude.'),
      el('div',{class:'stack'}, B('Create connector link', make, 'primary', 'spark'))], {title:'Connect to Claude'});
    return;
  }
  openSheet([
    el('ol',{class:'steps'},
      el('li',{}, el('b',{},'Copy the link'), ' below.'),
      el('li',{}, 'In Claude (claude.ai or the app), open ', el('b',{},'Settings → Connectors → Add custom connector'), '.'),
      el('li',{}, 'Name it ', el('b',{},'Outfits'), ', paste the link and add it.'),
      el('li',{}, 'In a chat, ask “What should I wear today?”')),
    el('input',{class:'field mono',value:url,readonly:true,onclick:e=>e.target.select()}),
    el('p',{class:'msg',style:'font-size:13px'},'Anyone with this link can see your wardrobe and make try-ons, which cost money. Don’t share it. Looks Claude saves appear here after the next sync.'),
    el('div',{class:'stack'},
      B('Copy link', ()=>copyText(url,'Connector link copied'), 'primary', 'copy'),
      B('Make a new link', async()=>{ if(await ask('Make a new link?','The old link stops working, so you’ll need to update it in Claude.','Make new link',false)) make(); }, '', 'refresh'),
      B('Turn off Claude access', ()=>{ closeSheet(); revoke(); }, 'danger'))
  ], {title:'Connect to Claude'});
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && SYNC.on && Date.now()-(+LS.get('op_sync_at','0'))>20000) syncNow();
});
setInterval(()=>{ if(document.visibilityState==='visible' && SYNC.on && !syncBusy) syncNow(); }, 90000);

async function clearTryOns(){
  for(const l of looks.values()) if(vers(l).length){ l.vdel=[...(l.vdel||[]), ...vers(l).map(v=>v.created)]; l.image=null; l.versions=[]; l.pick=0; await put('looks',l); }
  renderAll(); toast('Try-on photos deleted');
}
$('#btnClearLooks').onclick = async () => {
  const n=photoCount(); if(!n) return;
  if(await ask('Delete all try-on photos?',`This deletes ${plural(n,'try-on photo')}. Your wardrobe and saved outfits stay.`)) clearTryOns();
};

/* ---------- nav ---------- */
function switchView(v){
  closeSheet();
  $$('.view').forEach(s=>s.classList.toggle('on', s.id==='view-'+v));
  $$('#tabs button').forEach(b=>{ b.classList.toggle('on', b.dataset.v===v); b.setAttribute('aria-current', b.dataset.v===v?'page':'false'); });
  window.scrollTo(0,0);
}
$$('#tabs button').forEach(b=>b.onclick=()=>switchView(b.dataset.v));

function renderItemsOnly(){ renderTray(); renderBoard($('#board'), outfit); renderWardrobe(); renderLooks(); }
function renderAll(){ renderOutfit(); renderWardrobe(); renderLooks(); renderMe(); }

/* ---------- boot ---------- */
(async()=>{
  try{
    db=await openDB();
    items=(await getAll('items'))||[];
    for(const it of items) if(!CAT[it.cat]) it.cat='top';
    for(const l of (await getAll('looks'))||[]){
      if(Array.isArray(l.items)){ looks.set(l.key,l); continue; }
      // migrate v1 looks (top|bottom|shoes)
      const ids=[l.top,l.bottom,l.shoes].filter(Boolean), nl={key:lookKey(ids), items:ids, image:l.image||null, created:l.created||Date.now(), saved:true};
      if(!nl.key) continue;
      if(nl.key!==l.key) await del('looks',l.key);
      await put('looks',nl); looks.set(nl.key,nl);
    }
    me=(await get('meta','me'))||null;
    meId=(await get('meta','meId'))||null;
    if(me && !meId){ meId='m'+Date.now(); await put('meta',meId,'meId');
      for(const l of looks.values()) if(l.image && !l.meId){ l.meId=meId; await put('looks',l); } }
    navigator.storage?.persist?.().catch(()=>{});
    items.filter(i=>i.status==='work'||i.status==='raw'||(i.status==='err'&&!i.product)).forEach(i=>queueCleanup(i.id));
  }catch(e){ toast('Storage isn’t available in this browser, so nothing will be saved.', 5000); }
  outfit=enforce(outfit);
  if(!outfit.length && !LS.get('op_outfit')) outfit=enforce(['top','bottom','shoes'].map(c=>byCat(c)[0]?.id).filter(Boolean));
  if(looks.get(curKey())?.image) stageMode='me';
  if(!byCat(trayCat).length){ const c=CATS.find(c=>byCat(c.id).length); if(c) trayCat=c.id; }
  renderAll();
  if(SYNC.on) syncNow();
  if(LS.get('op_restored')){ try{ localStorage.removeItem('op_restored'); }catch{} toast('Backup restored'); }
})();
})();
</script>
